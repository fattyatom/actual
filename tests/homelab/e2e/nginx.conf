server {
    listen 80;
    server_name _;

    # Stand-in for the importer container (Traefik path-routes /importer in prod).
    # Prefix match: also covers /importer/, /importer?x=1, /importer/api, etc.
    location /importer {
        default_type text/html;
        return 200 '<!doctype html><meta charset="utf-8"><title>Importer</title><h1 id="importer-stub">IMPORTER_STUB_OK</h1>';
    }

    # Everything else → Actual Budget (the patched image). proxy_http_version +
    # Upgrade headers keep Actual's websocket sync working.
    location / {
        proxy_pass http://actual-budget:5006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
