# Builds + publishes the homelab Actual image from the homelab-importer branch.
#
#   fast  — verify the importer changes are present + denylist regex unit test
#   image — build (Dockerfile.homelab, amd64), run the Playwright E2E against it,
#           and on a branch push publish the *exact tested image* to
#           ghcr.io/fattyatom/actual:<version> + :latest (no rebuild).
#
# Named with a `homelab-` prefix so it never clashes with upstream's workflows.
name: homelab-image

on:
  push:
    branches: [homelab-importer]
  workflow_dispatch:

concurrency:
  group: homelab-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify importer changes present (post-rebase guard)
        run: bash tests/homelab/verify-importer.sh
      - name: Denylist regex unit test
        run: node tests/homelab/denylist.test.mjs

  image:
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v3
      - name: Resolve image version from the actual-server base tag
        id: ver
        run: |
          v=$(grep -oE 'actualbudget/actual-server:[0-9]+\.[0-9]+\.[0-9]+' Dockerfile.homelab | head -1 | cut -d: -f2)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build image (linux/amd64, load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.homelab
          load: true
          tags: actual:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Browser E2E (Importer button + /importer redirection)
        run: SKIP_BUILD=1 ACTUAL_IMAGE=actual:e2e bash tests/homelab/e2e/run.sh
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        run: |
          img="ghcr.io/${{ github.repository_owner }}/actual"
          docker tag actual:e2e "$img:${{ steps.ver.outputs.version }}"
          docker tag actual:e2e "$img:latest"
          docker push "$img:${{ steps.ver.outputs.version }}"
          docker push "$img:latest"
